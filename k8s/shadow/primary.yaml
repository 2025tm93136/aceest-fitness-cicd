# Shadow: users are served by primary; every request is mirrored to the shadow version (responses discarded).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-primary
  namespace: aceest
  labels: {app: aceest-fitness, track: primary}
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels: {app: aceest-fitness, deployment: aceest-primary}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: aceest-fitness, deployment: aceest-primary, track: primary}
    spec:
      containers:
        - name: aceest
          image: __IMAGE__:__STABLE_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          env:
            - {name: DEPLOYMENT_TRACK, value: "primary"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-primary
  namespace: aceest
spec:
  selector: {app: aceest-fitness, track: primary}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow-main
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow.aceest.svc.cluster.local$request_uri"
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  ingressClassName: nginx
  rules:
    - host: shadow.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: aceest-primary, port: {number: 80}}
