apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
  labels: {app: aceest-fitness, track: green}
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels: {app: aceest-fitness, deployment: aceest-green}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: aceest-fitness, deployment: aceest-green, track: green}
    spec:
      containers:
        - name: aceest
          image: __IMAGE__:__GREEN_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          env:
            - {name: DEPLOYMENT_TRACK, value: "green"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
