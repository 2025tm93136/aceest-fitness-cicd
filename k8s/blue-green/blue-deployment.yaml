# Blue-Green: two full environments; the Service selector decides which colour is live.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels: {app: aceest-fitness, track: blue}
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels: {app: aceest-fitness, deployment: aceest-blue}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: aceest-fitness, deployment: aceest-blue, track: blue}
    spec:
      containers:
        - name: aceest
          image: __IMAGE__:__BLUE_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          env:
            - {name: DEPLOYMENT_TRACK, value: "blue"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
