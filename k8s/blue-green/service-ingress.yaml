# Switch: kubectl -n aceest patch svc aceest-bluegreen -p '{"spec":{"selector":{"track":"green"}}}'
# Rollback = patch the selector back to the previous colour (instant).
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen
  namespace: aceest
spec:
  selector: {app: aceest-fitness, track: __LIVE_COLOR__}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-bluegreen
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - host: bluegreen.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: aceest-bluegreen, port: {number: 80}}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-blue-preview
  namespace: aceest
spec:
  selector: {app: aceest-fitness, track: blue}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-green-preview
  namespace: aceest
spec:
  selector: {app: aceest-fitness, track: green}
  ports: [{port: 80, targetPort: 5000}]
