apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-b
  namespace: aceest
  labels: {app: aceest-fitness, track: variant-b}
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels: {app: aceest-fitness, deployment: aceest-variant-b}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: aceest-fitness, deployment: aceest-variant-b, track: variant-b}
    spec:
      containers:
        - name: aceest
          image: __IMAGE__:__NEW_TAG__
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          env:
            - {name: DEPLOYMENT_TRACK, value: "variant-b"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-b
  namespace: aceest
spec:
  selector: {app: aceest-fitness, track: variant-b}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-b
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Variant"
    nginx.ingress.kubernetes.io/canary-by-header-value: "B"
    nginx.ingress.kubernetes.io/canary-by-cookie: "ab_variant"
spec:
  ingressClassName: nginx
  rules:
    - host: ab.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: aceest-variant-b, port: {number: 80}}
